def fetch_complot_meetings():
    log("Complot ג€“ ׳™׳©׳™׳‘׳•׳× ׳•׳¢׳“׳”...")
    meetings = []
    session = requests.Session()
    session.headers.update(HEADERS)
    urls = [
        "http://haifa.complot.co.il/newengine/Pages/meetings2.aspx",
        "http://haifa.complot.co.il/newengine/Pages/meetings.aspx",
        "https://haifa.complot.co.il/yeshivot/",
    ]
    for url in urls:
        try:
            r = session.get(url, timeout=15)
            if r.status_code != 200: continue
            soup = BeautifulSoup(r.text, "html.parser")
            for row in soup.select("tr, li"):
                text = row.get_text(strip=True)
                dm = re.search(r'\d{1,2}/\d{1,2}/\d{4}', text)
                if dm and 10 < len(text) < 300:
                    meetings.append({"text": text[:150], "date": dm.group(), "source_url": url, "is_pdf": False})
            for link in soup.find_all("a", href=True):
                href = link["href"]
                lt = link.get_text(strip=True)
                if any(x in href.lower() or x in lt for x in [".pdf","protocol"]):
                    full = href if href.startswith("http") else "http://haifa.complot.co.il" + href
                    meetings.append({"text": f"׳₪׳¨׳•׳˜׳•׳§׳•׳: {lt or href}", "date": datetime.now().strftime("%d/%m/%Y"), "source_url": full, "is_pdf": True})
            if meetings:
                log(f"  {len(meetings)} ׳™׳©׳™׳‘׳•׳×")
                break
        except Exception as e:
            log(f"  {url}: {e}")
    if not meetings:
        log("  Complot ׳™׳©׳™׳‘׳•׳× ג€“ ׳׳ ׳ ׳’׳™׳©")
    return meetings

def fetch_complot_permits():
