def fetch_mavat_plans(days_back=30):
    log("׳׳‘׳׳× ג€“ ׳×׳›׳ ׳™׳•׳×...")
    cutoff = int((datetime.now()-timedelta(days=days_back)).timestamp()*1000)
    try:
        r = requests.get(f"{IPLAN}/1/query", params={
            "where": f"CITY_CODE='6700' AND LAST_UPDATE_TIMESTAMP>={cutoff}",
            "outFields": "PLAN_NUMBER,PLAN_NAME,STATION_DESC,LAST_UPDATE,COMMITTEE_NAME",
            "returnGeometry": "false", "f": "json",
            "resultRecordCount": 200, "orderByFields": "LAST_UPDATE DESC",
        }, timeout=20)
        feats = r.json().get("features",[])
        log(f"  {len(feats)} ׳×׳›׳ ׳™׳•׳×")
        return [f["attributes"] for f in feats]
    except Exception as e:
        log(f"  ׳©׳’׳™׳׳”: {e}")
