def filter_nbhd(plans, nbhd):
    kws = NBHD.get(nbhd, [nbhd])
    return [p for p in plans if any(kw in str(p.get("PLAN_NAME",""))+str(p.get("COMMITTEE_NAME","")) for kw in kws)]

def detect_changes(plans, cache):
    prev = set(cache.get("plan_ids",[]))
    cur  = {str(p.get("PLAN_NUMBER","")) for p in plans}
    nids = cur - prev
    return {
        "new_plans":  [p for p in plans if str(p.get("PLAN_NUMBER","")) in nids],
        "approved":   [p for p in plans if "׳‘׳×׳•׳§׳£" in str(p.get("STATION_DESC","")) or "׳׳•׳©׳¨׳”" in str(p.get("STATION_DESC",""))],
        "deposited":  [p for p in plans if "׳”׳₪׳§׳“׳”" in str(p.get("STATION_DESC",""))],
        "rejected":   [p for p in plans if "׳¡׳™׳¨׳•׳‘" in str(p.get("STATION_DESC","")) or "׳“׳—׳™׳™׳”" in str(p.get("STATION_DESC",""))],
        "total": len(plans), "new_count": len(nids),
    }

